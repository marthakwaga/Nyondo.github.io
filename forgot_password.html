<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta

    />

    <title>HOMEPAGE</title>
    <!-- MDB icon -->

    <!-- Font Awesome -->

    <link rel="stylesheet" href="css/mdb.min.css" />

  </head>
  <body>
    <!-- Background image -->
    <div
      id="intro-example"
      class="p-5 text-center bg-image"
      style="
        background-image: url(&quot;https://images.pexels.com/photos/4312849/pexels-photo-4312849.jpeg&quot;);
      "
    >
      <!-- Form -->
      <form action="">
        <div
          class="mask mask-custom"
          style="background-color: rgba(25, 12, 36, 0.7)"
        >
          <div
            class="d-flex justify-content-center align-items-center h-100 style = 'max-width: 400px; width: 50%; min: vh-100px"
          >
            <!-- forgot password place -->
            <div
              class="bg-danger bg-opacity-10 p-4 rounded shadow"
              style="max-width: 400px; width: 50%; min: vh-100px"
            >
             <div class="logo bg-white p-4 rounded shadow mx-auto"></div>
        <br>
              <div data-mdb-input-init class="form-outline mb-4 p-1">
                <input
                  type="email"
                  id="form3Example3"
                  class="form-control form-control-lg"
                  placeholder="Enter a valid email address"
                />
                <label class="form-label" for="form3Example3"
                  >Email address</label
                >
              </div>
              <div data-mdb-input-init class="form-outline mb-4 p-1">
                <input
                  type="email"
                  id="form3Example3"
                  class="form-control form-control-lg"
                  placeholder="Enter a valid email address"
                />
                <label class="form-label" for="form3Example3"
                  >New password</label
                >
              </div>
              <div data-mdb-input-init class="form-outline mb-4 p-1">
                <input
                  type="email"
                  id="form3Example3"
                  class="form-control form-control-lg"
                  placeholder="Enter a valid email address"
                />
                <label class="form-label" for="form3Example3"
                  >Confirm new password</label
                >
              </div>
              <div class="text-center text-lg-start mt-4 pt-2">
                <button
                  type="submit"
                  data-mdb-button-init
                  data-mdb-ripple-init
                  class="btn btn-outline-primary btn-lg"
                  style="padding-left: 2.5rem; padding-right: 2.5rem"
                >
                  Send reset link to email
                </button>
              </div>
            </div>
          </div>
        </div>
      </form>
    </div>
    <!-- End of .container -->

    
    <script type="text/javascript" src="js/mdb.umd.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/mdb-ui-kit/6.4.0/mdb.min.js"></script>
