<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>NGH Sign Up</title>

<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">

<style>

</style>
</head>

<body class="d-flex justify-content-center align-items-center vh-100">

<div class="signup-card shadow">

  <!-- LOGO -->
  <div class="logo mb-3"></div>

  <h4 class="text-center mb-4">Create Account</h4>

  <!-- FORM -->
  <form onsubmit="register(event)">

    <!-- Username -->
    <div class="mb-3">
      <input type="text" id="firstname" class="form-control" placeholder="Username" required>
    </div>
    <div class="mb-3">
      <input type="text" name=""  id="lastname" class="form-control" required>
    </div>

    <!-- Email -->
    <div class="mb-3">
      <input type="email" id="email" class="form-control" placeholder="Email" required>
    </div>

    <!-- Password -->
    <div class="mb-3">
      <input type="password" id="password" class="form-control" placeholder="Password" required>
    </div>

    <!-- Role -->
    <div class="mb-3">
      <select id="role" class="form-select">
        <option value="attendant">Sales Attendant</option>
        <option value="manager">Manager</option>
        <option value="admin">Admin</option>
      </select>
    </div>

    <!-- Button -->
    <button class="btn btn-ngh w-100">Sign Up</button>

    <p class="text-center mt-3">
      Already have an account? <a href="login.html">Login</a>
    </p>

  </form>

</div>

<script>

</script>

</body>
</html>
