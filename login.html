<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1, shrink-to-fit=no"
    />
    <meta http-equiv="x-ua-compatible" content="ie=edge" />
    <title>HOMEPAGE</title>
    <!-- MDB icon -->
    <link rel="icon" href="img/mdb-favicon.ico" type="image/x-icon" />
    <!-- Font Awesome -->
    <link
      rel="stylesheet"
      href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css"
    />
    <!-- Google Fonts Roboto -->
    <link
      rel="stylesheet"
      href="https://fonts.googleapis.com/css2?family=Roboto:wght@300;400;500;700;900&display=swap"
    />
    <!-- MDB -->
     <link href="https://cdnjs.cloudflare.com/ajax/libs/mdb-ui-kit/6.4.0/mdb.min.css" rel="stylesheet"/>
    <link rel="stylesheet" href="/css/mdb.min.css" />
    <link rel="stylesheet" href="/nyondo.css">
  </head>


  <body class="d-flex flex-column min-vh-100">
  <!-- Background image -->
  <div
    id="intro-example"
    class="p-5 text-center bg-image" style="background-image: url('https://images.pexels.com/photos/4312849/pexels-photo-4312849.jpeg');" 
  >
  <!-- BACKGROUD IMAGE -->
   
    <div class="mask mask-custom" style="background-color: rgba(25, 12, 36, 0.7);">
      <div class="d-flex justify-content-center align-items-center h-100">

        <!-- FORM -->
         <div class="bg-danger bg-opacity-10 p-4 rounded shadow" style="max-width: 400px; width: 50%; min: vh-100px">

        <div class ="logo bg-white p-4 rounded shadow mx-auto"></div>
        <br>
        <!-- Email input -->
          <div data-mdb-input-init class="form-outline mb-4 p-1">
            <input name ='email' type="email" id="form3Example3" class="form-control form-control-lg"
              placeholder="Enter a valid email address" />
            <label class="form-label" for="form3Example3">Email address</label>
          </div>

          <!-- Password input -->
          <div data-mdb-input-init class="form-outline mb-4 p-1">
            <input name = 'password' type="password" id="form3Example4" class="form-control form-control-lg"
              placeholder="Enter password" />
            <label class="form-label" for="form3Example4">Password</label>
          </div>

          <div class="d-flex justify-content-between align-items-center">
            <!-- Checkbox -->
            <div class="form-check mb-0">
              <input class="form-check-input me-2" type="checkbox" value="" id="form2Example3" />
              <label class="form-check-label" for="form2Example3">
                Remember me
              </label>
            </div>
            <a href="forgot-password.pug" class="text-body">Forgot password?</a>
          </div>

          <div class="text-center text-lg-start mt-4 pt-2">
            <button  type="submit" data-mdb-button-init data-mdb-ripple-init class="btn btn-outline-primary btn-lg"
              style="padding-left: 2.5rem; padding-right: 2.5rem;">Login</button>
            <p class="small text-center-floating mt-2 pt-1 mb-0">Don't have an account? <a href="#!"
                class="link-warning">Register</a></p>
          </div>
        </div>
    </div>
  </div>
  <!-- Background image -->



    <script type="text/javascript" src="js/mdb.umd.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/mdb-ui-kit/6.4.0/mdb.min.js"></script>
    <!-- Custom scripts -->
    <script type="text/javascript"></script>
  </body>
</html>
