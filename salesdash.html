<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>NGH Attendant Dashboard</title>

<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
 <link rel="stylesheet" href="css/mdb.min.css" />
    <link rel="stylesheet" href="/css/salesdash.css">
<style>

</style>
</head>

<body>

<!-- SIDEBAR -->
<div class="sidebar">
  <h5>NGH Staff</h5>
  <a href="#">Dashboard</a>
  <a href="pos.html">POS</a>
  <a href="#">Stock</a>
</div>

<!-- MAIN -->
<div class="main">

  <!-- TOP -->
  <div class="d-flex justify-content-between mb-4">
    <h3>Sales Dashboard</h3>
    <span>Attendant</span>
  </div>

  <!-- KPI -->
  <div class="row g-3">

    <div class="col-md-4">
      <div class="card p-3 shadow-sm">
        <h6>Today's Sales</h6>
        <h4>UGX 450,000</h4>
      </div>
    </div>

    <div class="col-md-4">
      <div class="card p-3 shadow-sm">
        <h6>Transactions</h6>
        <h4>18</h4>
      </div>
    </div>

    <div class="col-md-4">
      <div class="card p-3 shadow-sm">
        <h6>Items Sold</h6>
        <h4>75</h4>
      </div>
    </div>

  </div>

  <!-- QUICK ACTION -->
  <div class="mt-4">
    <a href="pos.html" class="btn btn-success btn-lg w-100">
      Start New Sale
    </a>
  </div>

  <!-- LOW STOCK -->
  <div class="card mt-4 p-3 shadow-sm">
    <h5><i class="fas fa-bell text-danger"></i> Low Stock Alerts</h5>

    <table class="table">
      <thead>
        <tr>
          <th>Product</th>
          <th>Qty</th>
        </tr>
      </thead>
      <tbody>
        <tr class="text-danger">
          <td>Nails</td>
          <td>5</td>
        </tr>
        <tr class="text-danger">
          <td>Paint</td>
          <td>3</td>
        </tr>
      </tbody>
    </table>
  </div>

</div>

<script src="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/js/all.min.js"></script>

</body>
</html>
